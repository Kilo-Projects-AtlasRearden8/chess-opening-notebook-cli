[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-opening-notebook"
version = "0.1.0"
description = "Local-first Python CLI for chess players to log opening lines, traps, and refutations with PGN snippets and review dates."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Dylan Asdale", email = "dylanasdale@users.noreply.github.com" }]
license = { text = "MIT" }
keywords = ["chess", "pgn", "opening", "cli", "local-first"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Games/Entertainment :: Board Games",
]

[project.scripts]
chess-notebook = "chess_notebook.cli:main"

[tool.setuptools]
packages = ["chess_notebook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
